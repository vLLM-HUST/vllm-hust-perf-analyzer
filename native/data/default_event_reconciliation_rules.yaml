# Built-in policy. Model-specific changes belong in --rules-config overlays.
schema: traceloom-policy-v1
kind: event_reconciliation
metadata:
  manifest_schema: "traceloom.event-reconciliation-policy/v2"
  policy_id: "traceloom.default.event-reconciliation"
  policy_version: "3"
  unmatched_behavior: "independent"
rules:
  - priority: "100"
    rule_id: "ascend.task.mix-aiv.context-detail"
    provider_scope: "ascend"
    source_domain: "task"
    task_type: "KERNEL_MIX_AIV"
    generic_context_id: "4294967295"
    concrete_context_id: "0"
    min_contained_fraction: "0.99"
    task_op_type: ""
    communication_op_name_prefix: ""
    identity_policy: "same_source_ref,device,stream,raw_task_id,raw_connection_id"
    note: "Reconcile one generic mixed-AIV timing envelope with one context-specific operator record sharing exact task identity"
  - priority: "100"
    rule_id: "ascend.task.mix-aic.context-detail"
    provider_scope: "ascend"
    source_domain: "task"
    task_type: "KERNEL_MIX_AIC"
    generic_context_id: "4294967295"
    concrete_context_id: "0"
    min_contained_fraction: "0.99"
    task_op_type: ""
    communication_op_name_prefix: ""
    identity_policy: "same_source_ref,device,stream,raw_task_id,raw_connection_id"
    note: "Reconcile one generic mixed-AIC annotation envelope with one context-specific operator record sharing exact task identity"
  - priority: "90"
    rule_id: "ascend.task-communication.mc2-fused"
    provider_scope: "ascend"
    source_domain: "task+communication_op"
    task_type: ""
    generic_context_id: "-1"
    concrete_context_id: "-1"
    min_contained_fraction: "1.0"
    task_op_type: "MatmulAllReduce"
    communication_op_name_prefix: "MatmulAllReduceMc2AicpuKernel_"
    identity_policy: "same_input,device,unique_containment"
    note: "Reconcile one MC2 communication-provider observation into its unique containing fused MatmulAllReduce task anchor"
