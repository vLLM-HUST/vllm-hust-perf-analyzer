# Built-in policy. Model-specific changes belong in --rules-config overlays.
schema: traceloom-policy-v1
kind: symbol_normalization
metadata:
  policy_id: "traceloom.default-structural-symbols"
  policy_version: "2"
rules:
  - priority: "100"
    rule_id: "ascend.task.aiv-allreduce"
    provider_scope: "ascend"
    source_domain: "task"
    field: "any_identity"
    match: "contains_any_ci"
    pattern: "aiv_all_reduce|aiv_allreduce|aic_all_reduce|aic_allreduce|all_reduce_bfloat16|allreduce_bfloat16"
    structural_symbol: "AIV_AllReduce"
    note: "Canonicalize recognized device-side all-reduce task labels"
  - priority: "90"
    rule_id: "ascend.task.matmul-backend-variant"
    provider_scope: "ascend"
    source_domain: "task"
    field: "selected"
    match: "ascend_kernel_base_exact_any"
    pattern: "MatMulV1|MatMulV2|MatMulV3|BatchMatMulV1|BatchMatMulV2|BatchMatMulV3"
    structural_symbol: "MatMul"
    note: "Compare explicitly supported bare or CANN-decorated MatMul backend lowering labels"
  - priority: "100"
    rule_id: "collective.communication.allreduce-alias"
    provider_scope: "provider-neutral"
    source_domain: "communication"
    field: "any_identity"
    match: "contains_any_ci"
    pattern: "allreduce|all_reduce"
    structural_symbol: "AllReduce"
    note: "Canonicalize recognized all-reduce aliases"
  - priority: "95"
    rule_id: "ascend.communication.opaque-allreduce-instance"
    provider_scope: "ascend"
    source_domain: "communication"
    field: "op_name"
    match: "opaque_numeric_instance"
    pattern: "_"
    structural_symbol: "AllReduce"
    note: "Canonicalize supported opaque numeric collective instance labels"
  - priority: "90"
    rule_id: "collective.communication.reduce-scatter-alias"
    provider_scope: "provider-neutral"
    source_domain: "communication"
    field: "any_identity"
    match: "contains_any_ci"
    pattern: "reducescatter|reduce_scatter"
    structural_symbol: "ReduceScatter"
    note: "Canonicalize recognized reduce-scatter aliases"
  - priority: "80"
    rule_id: "collective.communication.allgather-alias"
    provider_scope: "provider-neutral"
    source_domain: "communication"
    field: "any_identity"
    match: "contains_any_ci"
    pattern: "allgather|all_gather"
    structural_symbol: "AllGather"
    note: "Canonicalize recognized all-gather aliases"
  - priority: "70"
    rule_id: "collective.communication.broadcast-alias"
    provider_scope: "provider-neutral"
    source_domain: "communication"
    field: "any_identity"
    match: "contains_ci"
    pattern: "broadcast"
    structural_symbol: "Broadcast"
    note: "Canonicalize recognized broadcast aliases"
  - priority: "60"
    rule_id: "collective.communication.alltoall-alias"
    provider_scope: "provider-neutral"
    source_domain: "communication"
    field: "any_identity"
    match: "contains_any_ci"
    pattern: "alltoall|all_to_all|all-to-all|all2all|a2a"
    structural_symbol: "AllToAll"
    note: "Canonicalize recognized all-to-all aliases"
  - priority: "10"
    rule_id: "ascend.task.decorated-kernel-base"
    provider_scope: "ascend"
    source_domain: "task"
    field: "selected"
    match: "ascend_decorated_kernel"
    pattern: "*"
    structural_symbol: "{kernel_base}"
    note: "Remove an audited CANN fingerprint/layout/mode suffix while retaining the concrete observed symbol"
