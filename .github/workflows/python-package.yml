name: Python package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "packaging/python/**"
      - "pyproject.toml"
      - ".github/workflows/python-package.yml"
  pull_request:
    paths:
      - "python/**"
      - "packaging/python/**"
      - "pyproject.toml"
      - ".github/workflows/python-package.yml"

permissions:
  contents: read

jobs:
  linux-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.architecture }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and repair self-contained native wheel
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          set -euo pipefail
          dnf install -y sqlite-devel libyaml-devel
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          python -m pip install build auditwheel
          python -m build --wheel --outdir dist
          auditwheel repair dist/*.whl --plat manylinux_2_28_${{ matrix.architecture }} -w wheelhouse
      - name: Install and exercise the wheel (no vLLM or accelerator)
        shell: bash
        run: |
          set -euo pipefail
          /opt/python/cp312-cp312/bin/python -m venv /tmp/traceloom-wheel-test
          /tmp/traceloom-wheel-test/bin/python -m pip install wheelhouse/*.whl
          /tmp/traceloom-wheel-test/bin/python python/tests/test_api.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: traceloom-wheel-${{ matrix.architecture }}
          path: wheelhouse/*.whl
