name: Native Debian package

on:
  pull_request:
    paths:
      - "native/**"
      - "packaging/**"
      - ".github/workflows/native-deb.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - "packaging/**"
      - ".github/workflows/native-deb.yml"

jobs:
  debian-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, install, analyze, and uninstall in clean Debian
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            debian:bookworm-slim \
            sh packaging/test_native_deb_in_debian.sh

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite development dependency
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure, build and test native contracts
        run: |
          cmake --preset dev-tests
          build_jobs=$(python3 -c 'import os; print(max(1, len(os.sched_getaffinity(0)) // 2))')
          cmake --build --preset dev-tests -j "$build_jobs"
          ctest --preset dev-tests --no-tests=error
