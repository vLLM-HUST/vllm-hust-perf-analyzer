<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
<title id="title">TraceLoom queryable database timeline experience</title>
<desc id="description">A hierarchical execution structure supports horizontal evidence drill-down and vertical cost comparison across equivalent occurrences.</desc>
